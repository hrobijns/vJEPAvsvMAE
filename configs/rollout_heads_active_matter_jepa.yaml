run_name: rollout_heads_active_matter_jepa
encoder_ckpt: checkpoints/active_matter_jepa.pt
out_dir: runs
seed: 0
bf16: true
log_every: 50
save_every: 500
data:
  base_path: /workspace/data
  dataset_name: active_matter
  n_frames: 8
  num_workers: 16
heads:
  predictor_dim: 384
  predictor_depth: 6
  predictor_heads: 6
  decoder_dim: 192
  decoder_depth: 4
  decoder_heads: 6
  norm_pix: true
optim:
  batch_size: 64
  total_steps: 20000
  warmup_steps: 1000
  lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
wandb:
  enabled: true
  project: vjepa-vmae-well

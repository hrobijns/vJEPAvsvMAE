run_name: rollout_heads_debug_mae
encoder_ckpt: runs/debug_mae/encoder_100pct.pt
out_dir: runs
seed: 0
bf16: true
log_every: 5
save_every: 25
data:
  base_path: ~/well_data
  dataset_name: turbulent_radiative_layer_2D
  n_frames: 8
  num_workers: 0
heads:
  predictor_dim: 384
  predictor_depth: 6
  predictor_heads: 6
  decoder_dim: 192
  decoder_depth: 4
  decoder_heads: 6
  norm_pix: true
optim:
  batch_size: 4
  total_steps: 50
  warmup_steps: 5
  lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
wandb:
  enabled: false
  project: vjepa-vmae-well

run_name: shear_flow_mae
objective_name: mae
out_dir: runs
seed: 0
bf16: true
log_every: 50
save_every: 1000
img_every: 5000
data:
  base_path: /workspace/data
  dataset_name: shear_flow
  n_frames: 8
  num_workers: 2
  memmap: true
  valid_stride: 8
val_every: 2000
encoder:
  patch_t: 2
  patch_h: 16
  patch_w: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
objective:
  mask_ratio: 0.9
  decoder_dim: 192
  decoder_depth: 4
  decoder_heads: 6
  norm_pix: true
optim:
  batch_size: 64
  total_steps: 100000
  warmup_steps: 5000
  lr: 5.0e-05
  min_lr: 1.0e-06
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
wandb:
  enabled: true
  project: vjepa-vmae-well

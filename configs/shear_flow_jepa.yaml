run_name: shear_flow_jepa
objective_name: jepa
out_dir: runs
seed: 0
bf16: true
log_every: 50
save_every: 1000
img_every: 5000
data:
  base_path: /workspace/data
  dataset_name: shear_flow
  n_frames: 8
  num_workers: 8
encoder:
  patch_t: 2
  patch_h: 16
  patch_w: 16
  embed_dim: 384
  depth: 12
  num_heads: 6
objective:
  mask_ratio: 0.9
  predictor_dim: 384
  predictor_depth: 6
  predictor_heads: 6
  ema_start: 0.996
  ema_end: 1.0
optim:
  batch_size: 64
  total_steps: 100000
  warmup_steps: 5000
  lr: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
wandb:
  enabled: true
  project: vjepa-vmae-well
